name: nightly check

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nightly-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: node scripts/test_history.mjs
      - run: node scripts/test_page.mjs
        env:
          # ubuntu-latest ships Chrome; fail rather than skip if that changes.
          REQUIRE_BROWSER: '1'
      - run: node scripts/test_findings.mjs
        env:
          REQUIRE_BROWSER: '1'
      - run: node scripts/parse.mjs
      - run: node scripts/check.mjs

      - name: Commit results
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add docs/results.json docs/badge history.json
          git diff --staged --quiet || git commit -m "nightly: $(date -u +%Y-%m-%d)"
          git push
